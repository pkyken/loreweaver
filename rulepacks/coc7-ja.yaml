subsystems:
  sanity_check:
    display: {ja: 正気度判定}
  skill_growth:
    display: {ja: 技能成長}
  spend_luck:
    display: {ja: 幸運}
  opposed_check:
    display: {ja: 対抗判定}
  random_madness:
    display: {ja: 狂気症状}
    tables:
      temp:
        display: {ja: 一時的狂気}
        aliases: [一時的, 一時, temporary]
        entries:
          - "記憶喪失：探索者は最後にいた安全な場所だけを覚えており、そこから現在地までの記憶を失う。"
          - "心因性障害：心理的な失明、難聴、または身体の一部を失ったような感覚に陥る。"
          - "暴力衝動：周囲を見境なく傷つけようとする暴力的な行動に陥る。"
          - "偏執：誰もが自分を傷つけようとしているという強い妄想に陥る。"
          - "依存：何らかの理由で特定の人物を精神的な支えとして強く頼る。"
          - "失神：その場で意識を失う。"
          - "逃避：あらゆる手段を使って現場から逃れようとする。"
          - "ヒステリー：笑う、泣く、叫ぶ、怯えるなど、極端な感情反応を示す。"
      long:
        display: {ja: 長期の狂気}
        aliases: [長期, long-term]
        entries:
          - "恐怖症：閉所恐怖症や高所恐怖症など、特定の対象への恐怖症を発症する。"
          - "躁状態：窃盗癖や放火癖など、制御しにくい衝動的な症状を発症する。"
          - "幻覚：現実には存在しないものを継続的に知覚する。"
          - "偏執：強い疑念と被害妄想が長く続く。"
          - "解離性障害：人格の分裂や記憶の欠落が生じる。"
          - "強迫症：特定の行動や確認を繰り返さずにはいられなくなる。"
          - "抑うつ：深刻な抑うつ状態に陥る。"
          - "心的外傷後ストレス障害：恐怖体験による心理的な傷が長期間続く。"
      indefinite:
        display: {ja: 不定の狂気}
        aliases: [不定, indefinite]
        entries:
          - "周囲のすべてが自分を狙っているという、強烈な被害妄想に取りつかれる。"
          - "手洗いや施錠確認など、反復行動を自分で止められなくなる。"
          - "自分が世界から切り離されたように感じる、深刻な解離症状が現れる。"
          - "悪夢と不眠が続き、精神が著しく衰弱する。"
          - "特定の色や音に対して、極端な恐怖と拒絶反応を示す。"
          - "普段とはまったく異なる第二の人格が現れる。"
          - "時間の感覚を失い、時間が逆行または停止していると信じる。"
          - "自分が人ならざる生物へ変化したと確信する。"

