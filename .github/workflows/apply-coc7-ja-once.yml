name: Apply CoC7 Japanese locale once

on:
  push:
    branches: [feature/japanese-localization]
    paths:
      - .github/workflows/apply-coc7-ja-once.yml
      - scripts/_apply_coc7_ja_once.py
      - scripts/_apply_coc7_ja_once_v2.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-coc7-ja-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/japanese-localization
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Apply Japanese CoC7 vocabulary and tests
        run: python scripts/_apply_coc7_ja_once_v2.py
      - name: Remove one-shot migration files
        run: git rm -f scripts/_apply_coc7_ja_once.py scripts/_apply_coc7_ja_once_v2.py .github/workflows/apply-coc7-ja-once.yml
      - name: Install test dependencies
        run: uv sync --locked --extra ejs
      - name: Validate focused regression suite
        run: uv run pytest -q tests/i18n/test_coc7_japanese.py tests/i18n/test_command_dialects.py tests/core/test_rulepacks.py
      - name: Validate formatting and whitespace
        run: git diff --check
      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "i18n(coc7): add Japanese rules vocabulary"
          git push origin HEAD:feature/japanese-localization
